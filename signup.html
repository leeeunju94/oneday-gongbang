<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>회원가입 | 원데이 클래스 공방</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;600&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-glow" aria-hidden="true"></div>
  <header class="wrap top glass"><a class="brand" href="/">원데이 클래스 공방</a><nav><a href="/login.html">로그인</a></nav></header>
  <main class="narrow">
    <h1>회원가입</h1>
    <p class="sub">이메일과 비밀번호만 있으면 돼요. 견적 요청은 가입하지 않아도 남길 수 있어요.</p>
    <form class="form glass" id="f" novalidate>
      <div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="new-password" minlength="8" required><span class="hint">8자 이상</span></div>
      <label class="agree"><input type="checkbox" id="consent"><span>(필수) 회원 관리를 위해 이메일을 받고, 탈퇴하면 지워요. <a href="/privacy.html">개인정보 처리방침</a></span></label>
      <button class="btn" type="submit" id="btn">가입하기</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div class="links"><a href="/login.html">이미 가입했어요</a></div>
  </main>
  <script src="/auth.js"></script>
  <script>
    const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = f.email.value.trim(), password = f.pw.value;
      if (!email || !email.includes('@')) return showMsg(msg, '이메일을 확인해 주세요.');
      if (password.length < 8) return showMsg(msg, '비밀번호는 8자 이상으로 정해 주세요.');
      if (!document.getElementById('consent').checked) return showMsg(msg, '개인정보 수집·이용에 동의해 주세요.');
      btn.disabled = true;
      try {
        const r = await Auth.call('signup', { email, password, data: { consent: true, consent_at: new Date().toISOString() } });
        if (!r.ok) {
          const t = String(r.data.msg || r.data.error_description || r.data.message || '');
          showMsg(msg, /registered|exists/i.test(t) ? '이미 가입한 이메일이에요. 로그인해 주세요.' : /rate|limit/i.test(t) ? '지금 가입이 몰려 있어요. 잠시 뒤 다시 시도해 주세요.' : '가입하지 못했어요. 이메일과 비밀번호를 확인해 주세요.');
        } else if (r.data.access_token) {
          Auth.save(r.data.access_token); location.href = '/members.html';
        } else {
          f.reset(); showMsg(msg, '확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.', true);
        }
      } catch (err) { showMsg(msg, err.message); }
      finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
