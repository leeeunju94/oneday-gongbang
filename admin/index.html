<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>공방 관리자</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;600&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin { width: min(720px, 100% - 32px); margin: 24px auto 80px; }
    .admin h1 { font-family: var(--serif); font-weight: 400; font-size: 40px; letter-spacing: -0.03em; margin: 0 0 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tabs button { flex: 1; min-height: 48px; border: 1.5px solid var(--edge-strong); border-radius: var(--radius-s); background: transparent; color: var(--text); font: 600 16px var(--sans); cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--text); color: var(--black); border-color: var(--text); }
    .count { background: var(--glass); border: 1px solid var(--edge); border-radius: var(--radius-s); padding: 18px 20px; margin-bottom: 16px; }
    .count strong { font-size: 40px; line-height: 1.1; display: block; }
    .count span { color: var(--text-soft); }
    .cards { display: grid; gap: 12px; }
    .card { border: 1.5px solid var(--edge-strong); border-radius: var(--radius-s); padding: 16px; }
    .card.new { border-color: var(--violet); }
    .card .meta { font-size: 14px; color: var(--text-soft); }
    .card .who { font-size: 18px; font-weight: 700; margin: 4px 0; }
    .card .contact { background: none; border: 0; padding: 0; font: 500 17px var(--sans); color: var(--violet); text-decoration: underline; cursor: pointer; }
    .card .what { margin: 8px 0 12px; }
    .status { display: flex; gap: 6px; }
    .status button { flex: 1; min-height: 44px; border: 1.5px solid var(--edge-strong); border-radius: var(--radius-s); background: transparent; color: var(--text); font: 600 15px var(--sans); cursor: pointer; }
    .status button[aria-pressed="true"] { background: var(--violet); color: #fff; border-color: var(--violet); }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .empty { color: var(--text-soft); padding: 24px 0; }
  </style>
</head>
<body>
  <main class="admin">
    <h1>공방 관리자</h1>

    <form id="loginForm" class="form">
      <div class="field">
        <label for="pw">관리자 비밀번호</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">들어가기</button>
      <p class="msg err" id="loginMsg" role="alert"></p>
    </form>

    <section id="panel" hidden>
      <div class="bar">
        <div class="tabs" role="tablist" style="flex:1;margin:0">
          <button type="button" role="tab" id="tabInq" aria-selected="true">견적 요청</button>
          <button type="button" role="tab" id="tabMem" aria-selected="false">회원</button>
        </div>
      </div>
      <p class="msg err" id="panelMsg" role="alert"></p>

      <div id="viewInq">
        <div class="count"><strong id="newCount">0</strong><span>건의 새 견적 요청</span></div>
        <div class="cards" id="inqList"></div>
      </div>

      <div id="viewMem" hidden>
        <div class="count"><strong id="memCount">0</strong><span>명의 회원</span></div>
        <div class="cards" id="memList"></div>
      </div>

      <p style="margin-top:28px"><button class="btn btn-ghost btn-small" id="logout" type="button">나가기</button></p>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const STATUSES = ['새 문의', '연락함', '완료'];
    const KEY = 'gongbang-admin-pw';
    const getPw = () => { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } };
    const setPw = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch {} };
    const fmt = (s) => s ? new Date(s).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) : '-';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function api(path, opts = {}) {
      const r = await fetch(path, { ...opts, headers: { 'x-admin-password': getPw(), 'Content-Type': 'application/json', ...(opts.headers || {}) } });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { const e = new Error(data.error || '비밀번호가 맞지 않아요.'); e.auth = true; throw e; }
      if (!r.ok) throw new Error(data.error || '불러오지 못했어요.');
      return data;
    }

    function showLogin(message) {
      setPw('');
      $('panel').hidden = true; $('loginForm').hidden = false;
      $('loginMsg').textContent = message || '';
      $('pw').value = ''; $('pw').focus();
    }

    async function loadInquiries() {
      const { rows } = await api('/api/admin');
      $('newCount').textContent = rows.filter((r) => r.status === '새 문의').length;
      $('inqList').innerHTML = rows.length ? rows.map((r) => `
        <article class="card${r.status === '새 문의' ? ' new' : ''}">
          <div class="meta">${fmt(r.created_at)}</div>
          <div class="who">${esc(r.name)}</div>
          <button class="contact" type="button" data-copy="${esc(r.contact)}">${esc(r.contact)}</button>
          <p class="what">하고 싶은 클래스: ${esc(r.class_wanted) || '적지 않음'}</p>
          <div class="status">${STATUSES.map((s) => `<button type="button" data-id="${r.id}" data-status="${s}" aria-pressed="${r.status === s}">${s}</button>`).join('')}</div>
        </article>`).join('') : '<p class="empty">아직 들어온 견적 요청이 없어요.</p>';
    }

    async function loadMembers() {
      const { users } = await api('/api/admin?view=members');
      $('memCount').textContent = users.length;
      $('memList').innerHTML = users.length ? users.map((u) => `
        <article class="card">
          <div class="who">${esc(u.email)}</div>
          <div class="meta">가입 ${fmt(u.created_at)} · 마지막 로그인 ${fmt(u.last_sign_in_at)}</div>
        </article>`).join('') : '<p class="empty">아직 가입한 회원이 없어요.</p>';
    }

    async function refresh() {
      $('panelMsg').textContent = '';
      try {
        if ($('viewMem').hidden) await loadInquiries(); else await loadMembers();
        $('loginForm').hidden = true; $('panel').hidden = false;
      } catch (e) {
        if (e.auth) showLogin('비밀번호가 맞지 않아요.');
        else { $('loginForm').hidden = true; $('panel').hidden = false; $('panelMsg').textContent = e.message; }
      }
    }

    $('loginForm').addEventListener('submit', (e) => { e.preventDefault(); setPw($('pw').value); $('loginMsg').textContent = ''; refresh(); });
    $('logout').addEventListener('click', () => showLogin(''));

    function selectTab(mem) {
      $('tabInq').setAttribute('aria-selected', String(!mem));
      $('tabMem').setAttribute('aria-selected', String(mem));
      $('viewInq').hidden = mem; $('viewMem').hidden = !mem;
      refresh();
    }
    $('tabInq').addEventListener('click', () => selectTab(false));
    $('tabMem').addEventListener('click', () => selectTab(true));

    $('inqList').addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.copy !== undefined) {
        try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '복사했어요'; setTimeout(() => (b.textContent = b.dataset.copy), 1200); }
        catch { const range = document.createRange(); range.selectNodeContents(b); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); }
        return;
      }
      if (b.dataset.status) {
        try { await api('/api/admin', { method: 'PATCH', body: JSON.stringify({ id: Number(b.dataset.id), status: b.dataset.status }) }); await loadInquiries(); }
        catch (err) { if (err.auth) showLogin('비밀번호가 맞지 않아요.'); else $('panelMsg').textContent = err.message; }
      }
    });

    if (getPw()) refresh(); else $('pw').focus();
  </script>
</body>
</html>
